# Mechanical turk query: sum of the final consumption of natural gas and gas products over all sectors (non-energetic use only).
# The result should equal final_consumption_of_natural_gas_and_gas_products_non_energetic.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_natural_gas_and_gas_products_in_national_transport_non_energetic),
      Q(final_consumption_of_natural_gas_and_gas_products_in_other_non_energetic),
      Q(final_consumption_of_natural_gas_and_gas_products_in_industry_non_energetic)
    )
