# Mechanical turk query: sum of the final consumption per carrier in agriculture (energetic and non-energetic use combined).
# The carrier exceptions (network_gas, waste_mix, crude oil mix) are incorporated in the carrier
# groups, so the result should equal
# final_consumption_from_agriculture_total.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_ammonia_in_agriculture_total),
      Q(final_consumption_of_coal_and_coal_products_in_agriculture_total),
      Q(final_consumption_of_electricity_in_agriculture_total),
      Q(final_consumption_of_gaseous_biofuels_in_agriculture_total),
      Q(final_consumption_of_geothermal_in_agriculture_total),
      Q(final_consumption_of_heat_in_agriculture_total),
      Q(final_consumption_of_hydrogen_in_agriculture_total),
      Q(final_consumption_of_liquid_biofuels_in_agriculture_total),
      Q(final_consumption_of_methanol_in_agriculture_total),
      Q(final_consumption_of_natural_gas_and_gas_products_in_agriculture_total),
      Q(final_consumption_of_non_renewable_waste_in_agriculture_total),
      Q(final_consumption_of_oil_and_oil_products_in_agriculture_total),
      Q(final_consumption_of_renewable_waste_in_agriculture_total),
      Q(final_consumption_of_solar_thermal_in_agriculture_total),
      Q(final_consumption_of_solid_biofuels_in_agriculture_total)
    )
