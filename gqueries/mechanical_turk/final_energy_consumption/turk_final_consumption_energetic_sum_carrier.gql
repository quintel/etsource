# Mechanical turk query: sum of the final consumption of all carriers over all sectors (energetic use only).
# The carrier exceptions (network_gas, waste_mix, crude oil mix) are incorporated in the carrier
# groups, so the result should equal
# final_consumption_energetic.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_ammonia_energetic),
      Q(final_consumption_of_coal_and_coal_products_energetic),
      Q(final_consumption_of_electricity_energetic),
      Q(final_consumption_of_gaseous_biofuels_energetic),
      Q(final_consumption_of_geothermal_energetic),
      Q(final_consumption_of_heat_energetic),
      Q(final_consumption_of_hydrogen_energetic),
      Q(final_consumption_of_liquid_biofuels_energetic),
      Q(final_consumption_of_methanol_energetic),
      Q(final_consumption_of_natural_gas_and_gas_products_energetic),
      Q(final_consumption_of_non_renewable_waste_energetic),
      Q(final_consumption_of_oil_and_oil_products_energetic),
      Q(final_consumption_of_renewable_waste_energetic),
      Q(final_consumption_of_solar_thermal_energetic),
      Q(final_consumption_of_solid_biofuels_energetic)
    )
