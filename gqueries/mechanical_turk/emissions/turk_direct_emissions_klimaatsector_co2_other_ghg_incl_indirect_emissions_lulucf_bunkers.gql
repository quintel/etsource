# Sum of total CO2 and other GHG emissions Klimaatsector categories incl. indirect emissions
# (indirecte emissies), LULUCF (landgebruik) and international transport
# (internationaal transport)

- unit = MT
- query =
    SUM(
      Q(direct_emissions_klimaattafel_co2_incl_indirecte_emissies_landgebruik_internationaal_transport),
      Q(direct_emissions_klimaattafel_other_ghg_incl_indirecte_emissies_landgebruik_internationaal_transport)
    )
