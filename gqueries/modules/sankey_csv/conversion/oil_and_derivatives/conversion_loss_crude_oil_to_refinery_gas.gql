# Refinery gas that is not used in industry ends up in industry_refinery_gas_for_energy, which has
# no outgoing edges. To ensure equal inputs and outputs in the oil balance, it is allocated as a loss.

- query =
    DIVIDE(
      SUM(
        V(
          FILTER(G(sankey_conversion_group),"refinery_gas_output_conversion > 0.0 && crude_oil_input_conversion > 0.0"),
          "refinery_gas_output_conversion * crude_oil_input_conversion / (1 - loss_output_conversion) * output_of_loss"
        ),
        V(
          industry_refinery_gas_for_energy,
          demand
        )
      ),
      BILLIONS
    )
- unit = PJ
