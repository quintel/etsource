# Input of crude oil to fossil refinery transformation
#
# Excludes the crude oil burner (industry_chemicals_refineries_burner_crude_oil).
# Its input is shown as backflows of oil products to the fossil refinery
# Does add the 'crude oil' that flows directly to refinery gas production.

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          industry_refinery_transformation_crude_oil,
          industry_total_production_refinery_gas,
          energy_chemical_refineries_transformation_external_coupling_node,
          input_of_crude_oil
          )
        ),
        BILLIONS
    )
