# Kerosene to Industry
#
# Excludes the part used by refineries, which is shown as a backflow to the
# fossil refinery (kerosene_to_fossil_refinery).

- unit = PJ
- query =
    SUM(
      DIVIDE(
        SUM(
          V(industry_final_demand_kerosene, demand),
          V(industry_final_demand_kerosene_non_energetic, demand)
        ),
        BILLIONS
      ),
      NEG(Q(kerosene_to_fossil_refinery))
    )
