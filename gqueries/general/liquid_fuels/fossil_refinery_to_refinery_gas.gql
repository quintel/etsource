# Output of refinery_gas from fossil refinery transformation
# The node 'industry total production refinery gas' is used that combines the production from the
# refinery node and the direct input from 'distribution of crude oil'

- unit = PJ
- query =
    DIVIDE(
      SUM(
       V(
        industry_total_production_refinery_gas,
        energy_chemical_refineries_transformation_external_coupling_node,
        output_of_refinery_gas
        )
      ),
      BILLIONS
    )
