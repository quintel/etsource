# Loss output from fossil refinery transformation
#
# Electricity is counted through its non-heat consumers only: the refinery p2h
# nodes are already part of the heat_production group.

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(industry_refinery_transformation_crude_oil, output_of_loss),
        V(
          INTERSECTION(
            G(heat_production),
            G(refineries_industry)
          ),
          industry_useful_demand_for_chemical_refineries_electricity,
          industry_chemicals_refineries_captured_co2_electricity,
          industry_final_demand_for_chemical_refineries_steam_hot_water,
          demand
        )
      ),
      BILLIONS
    )
