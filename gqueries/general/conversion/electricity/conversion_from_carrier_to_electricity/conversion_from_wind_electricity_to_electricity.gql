# Direct conversion input of wind for central electricity production
# For renewable energy carriers the output of electricity is taken by convention
# The group electricity_producing_wind_converters also includes the output node of the
# inland wind turbine with battery system, which has no wind input itself

- query =
      DIVIDE(
        SUM(
          V(
            Q(electricity_producing_wind_converters),
            output_of_electricity
          )
        ),
      BILLIONS
      )

- unit = PJ
