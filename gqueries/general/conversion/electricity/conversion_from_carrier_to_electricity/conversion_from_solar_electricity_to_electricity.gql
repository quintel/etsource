# Direct conversion input of solar for central electricity production
# For renewable energy carriers the output of electricity is taken by convention
# The group electricity_producing_solar_converters also includes the output node of the
# solar PV plant with battery system, which has no solar radiation input itself

- query =
      DIVIDE(
        SUM(
          V(
            Q(electricity_producing_solar_converters),
            output_of_electricity
          )
        ),
      BILLIONS
      )

- unit = PJ
