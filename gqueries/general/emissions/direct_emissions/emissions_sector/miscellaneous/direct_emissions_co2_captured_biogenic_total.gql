# Total captured biogenic CO2 of all sectors
# Note: The molecule graph does not distinguish whether captured CO₂ is biogenic or fossil.
# This query excludes biogenic CO2 captured in the molecule graph (wood pellets in paper, food, chemicals,
# fertilizers, refineries); that share is counted in direct_emissions_co2_captured_fossil_total.

- unit = MT
- query =
    DIVIDE(
      SUM(
        V(
          G(direct_emissions),
          direct_co2_output_production_capture_biogenic
        )
      ),
      BILLIONS
    )
