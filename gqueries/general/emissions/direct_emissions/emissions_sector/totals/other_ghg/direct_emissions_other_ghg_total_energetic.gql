# Total energetic other GHG emissions of all sectors

- unit = MT
- query =
    DIVIDE(
      SUM(
        V(
          INTERSECTION(G(direct_emissions), USE(energetic)),
          direct_reporting_emissions_other_ghg_emissions
        ),
        MV(
          INTERSECTION(MG(direct_emissions), MUSE(energetic)),
          direct_reporting_emissions_other_ghg_emissions
        )
      ),
      BILLIONS
    )
