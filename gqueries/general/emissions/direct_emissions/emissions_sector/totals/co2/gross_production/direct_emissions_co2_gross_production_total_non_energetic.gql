# Total gross non-energetic CO2 production (before capture) of all sectors

- unit = MT
- query =
    DIVIDE(
      SUM(
        V(
          INTERSECTION(G(direct_emissions), USE(non_energetic)),
          direct_reporting_emissions_co2_production
        ),
        MV(
          INTERSECTION(MG(direct_emissions), MUSE(non_energetic)),
          direct_reporting_emissions_co2_production
        )
      ),
      BILLIONS
    )
