# Total net CO2 emissions of all sectors: gross CO2 production minus all captured CO2

- unit = MT
- query =
    SUM(
      Q(direct_emissions_co2_gross_production_total_energetic),
      Q(direct_emissions_co2_gross_production_total_non_energetic),
      Q(direct_emissions_co2_captured_fossil_total),
      Q(direct_emissions_co2_captured_biogenic_total),
      Q(direct_emissions_co2_captured_dac),
      Q(direct_emissions_co2_captured_lulucf)
    )
