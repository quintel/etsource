# Total other GHG emissions incl. indirect emissions (indirecte emissies), excl. land use
# (landgebruik), international transport

- unit = MT
- query =
    SUM(
      Q(direct_emissions_klimaattafel_other_ghg_incl_indirecte_emissies_landgebruik_internationaal_transport),
      NEG(Q(direct_emissions_klimaattafel_landgebruik_other_ghg)),
      NEG(Q(direct_emissions_klimaattafel_internationaal_transport_other_ghg))
    )
