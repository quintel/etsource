# Total GHG emissions incl. indirect emissions (indirecte emissies), land use
# (landgebruik), international transport

- unit = MT
- query =
    SUM(
      Q(direct_emissions_klimaattafel_elektriciteit_total_ghg),
      Q(direct_emissions_klimaattafel_industrie_total_ghg),
      Q(direct_emissions_klimaattafel_mobiliteit_total_ghg),
      Q(direct_emissions_klimaattafel_gebouwde_omgeving_total_ghg),
      Q(direct_emissions_klimaattafel_landbouw_total_ghg),
      Q(direct_emissions_klimaattafel_landgebruik_total_ghg),
      Q(direct_emissions_klimaattafel_indirecte_emissies_total_ghg),
      Q(direct_emissions_klimaattafel_internationaal_transport_total_ghg)
    )
