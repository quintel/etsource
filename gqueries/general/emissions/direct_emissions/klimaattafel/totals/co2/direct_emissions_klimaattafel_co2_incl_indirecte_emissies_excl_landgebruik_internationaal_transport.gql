# Total CO2 emissions incl. indirect emissions (indirecte emissies), excl. land use
# (landgebruik), international transport

- unit = MT
- query =
    SUM(
      Q(direct_emissions_klimaattafel_co2_incl_indirecte_emissies_landgebruik_internationaal_transport),
      NEG(Q(direct_emissions_klimaattafel_landgebruik_co2)),
      NEG(Q(direct_emissions_klimaattafel_internationaal_transport_co2))
    )
