# Total GHG emissions for 1990 excl. indirect emissions (indirecte emissies), land use
# (landgebruik), international transport

- unit = MT
- query =
    SUM(
      Q(direct_emissions_klimaattafel_total_ghg_incl_indirecte_emissies_landgebruik_internationaal_transport_1990),
      NEG(Q(direct_emissions_klimaattafel_indirecte_emissies_total_ghg_1990)),
      NEG(Q(direct_emissions_klimaattafel_landgebruik_total_ghg_1990)),
      NEG(Q(direct_emissions_klimaattafel_internationaal_transport_total_ghg_1990))
    )
