# Total CO2 emissions for 1990 incl. indirect emissions (indirecte emissies), land use
# (landgebruik), international transport

- unit = MT
- query =
    SUM(
      Q(direct_emissions_klimaattafel_elektriciteit_co2_1990),
      Q(direct_emissions_klimaattafel_industrie_co2_1990),
      Q(direct_emissions_klimaattafel_mobiliteit_co2_1990),
      Q(direct_emissions_klimaattafel_gebouwde_omgeving_co2_1990),
      Q(direct_emissions_klimaattafel_landbouw_co2_1990),
      Q(direct_emissions_klimaattafel_landgebruik_co2_1990),
      Q(direct_emissions_klimaattafel_indirecte_emissies_co2_1990),
      Q(direct_emissions_klimaattafel_internationaal_transport_co2_1990)
    )
