# Total CO2 emissions for 1990 incl. land use (landgebruik), excl. indirect emissions
# (indirecte emissies), international transport

- unit = MT
- query =
    SUM(
      Q(direct_emissions_klimaatsector_co2_incl_indirecte_emissies_landgebruik_internationaal_transport_1990),
      NEG(Q(direct_emissions_klimaatsector_indirecte_emissies_co2_1990)),
      NEG(Q(direct_emissions_klimaatsector_internationaal_transport_co2_1990))
    )
