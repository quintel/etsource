# Total other GHG emissions for 1990 incl. land use (landgebruik), excl. indirect
# emissions (indirecte emissies), international transport

- unit = MT
- query =
    SUM(
      Q(direct_emissions_klimaatsector_other_ghg_incl_indirecte_emissies_landgebruik_internationaal_transport_1990),
      NEG(Q(direct_emissions_klimaatsector_indirecte_emissies_other_ghg_1990)),
      NEG(Q(direct_emissions_klimaatsector_internationaal_transport_other_ghg_1990))
    )
