# Total GHG emissions for 1990 incl. indirect emissions (indirecte emissies), land use
# (landgebruik), international transport

- unit = MT
- query =
    SUM(
      Q(direct_emissions_klimaatsector_elektriciteit_total_ghg_1990),
      Q(direct_emissions_klimaatsector_industrie_total_ghg_1990),
      Q(direct_emissions_klimaatsector_mobiliteit_total_ghg_1990),
      Q(direct_emissions_klimaatsector_gebouwde_omgeving_total_ghg_1990),
      Q(direct_emissions_klimaatsector_landbouw_total_ghg_1990),
      Q(direct_emissions_klimaatsector_landgebruik_total_ghg_1990),
      Q(direct_emissions_klimaatsector_indirecte_emissies_total_ghg_1990),
      Q(direct_emissions_klimaatsector_internationaal_transport_total_ghg_1990)
    )
