# Total GHG emissions excl. indirect emissions (indirecte emissies), land use
# (landgebruik), international transport

- unit = MT
- query =
    SUM(
      Q(direct_emissions_klimaatsector_total_ghg_incl_indirecte_emissies_landgebruik_internationaal_transport),
      NEG(Q(direct_emissions_klimaatsector_indirecte_emissies_total_ghg)),
      NEG(Q(direct_emissions_klimaatsector_landgebruik_total_ghg)),
      NEG(Q(direct_emissions_klimaatsector_internationaal_transport_total_ghg))
    )
