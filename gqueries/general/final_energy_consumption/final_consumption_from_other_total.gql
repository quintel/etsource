# Final consumption from other, all carriers (energetic and non-energetic use combined).
#
# Sector:      Other -- sector == :other
# Carrier:     All carriers
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "sector == :other"),
          value
        )
      ),
      BILLIONS
    )
