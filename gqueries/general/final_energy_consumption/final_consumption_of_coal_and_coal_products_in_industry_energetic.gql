# Final consumption of coal and coal products in industry (energetic use only).
#
# Sector:      Industry -- sector == :industry
# Carrier:     Coal and coal products -- coal? || coal_gas? || cokes? || lignite?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :industry"),
              "coal? || coal_gas? || cokes? || lignite?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
