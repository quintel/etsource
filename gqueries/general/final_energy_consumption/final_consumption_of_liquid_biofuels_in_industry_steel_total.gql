# Final consumption of liquid biofuels in industry ex. ict and refineries - steel (energetic and non-energetic use combined).
#
# Sector:      Industry ex. ICT and refineries - Steel -- EG(steel_industry)
# Carrier:     Liquid biofuels
# Use type:    Total
#
# Exception: includes the biogenic share of crude oil in agriculture, buildings, households, industry.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_liquid_biofuels_in_industry_steel_energetic)
    )
