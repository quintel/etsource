# Final consumption of solar thermal in industry ex. ict and refineries - steel (energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Steel -- EG(steel_industry)
# Carrier:     Solar thermal -- solar_thermal?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(steel_industry)), "solar_thermal?"),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
