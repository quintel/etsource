# Final consumption from industry ex. ict and refineries, all carriers (energetic and non-energetic use combined).
#
# Sector:      Industry ex. ICT and refineries -- sector == :industry minus EG(ict_industry), EG(refineries_industry)
# Carrier:     All carriers
# Use type:    Total
#
# Exception: industry minus industry ict, industry refineries.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_from_industry_total),
      NEG(Q(final_consumption_from_industry_ict_total)),
      NEG(Q(final_consumption_from_industry_refineries_total))
    )
