# Final consumption of renewable waste in waste mix in industry ex. ict and refineries - food (energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Food -- EG(food_industry)
# Carrier:     Renewable waste in waste mix
# Use type:    Energetic -- energetic?
#
# Waste mix times the share of renewable waste in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_waste_mix_in_industry_food_energetic),
      Q(share_of_biogenic_waste_in_waste_mix)
    )
