# Final consumption of liquid biofuels in industry ex. ict and refineries - other (non-energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Other -- EG(other_non_specified_industry)
# Carrier:     Liquid biofuels -- biodiesel? || bio_ethanol? || bio_kerosene? || bio_oil? || bionaphtha? || biomethanol? || bio_pyrolysis_oil? || oily_biomass? + crude_oil? x Q(share_of_biogenic_in_industry_final_demand_crude_oil_non_energetic)
# Use type:    Non-energetic -- !energetic?
#
# Exception: includes the biogenic share of crude oil in agriculture, buildings, households, industry.
#
# Generated by generate_fec_query_set.py from final_energy_consumption_query_set_v3_*.csv.
# Do not edit by hand -- regenerate instead.

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(other_non_specified_industry)), "biodiesel? || bio_ethanol? || bio_kerosene? || bio_oil? || bionaphtha? || biomethanol? || bio_pyrolysis_oil? || oily_biomass?"),
            "!energetic?"
          ),
          value
        ),
        PRODUCT(
          SUM(
            V(
              FILTER(
                FILTER(INTERSECTION(EG(final_demand), EG(other_non_specified_industry)), "crude_oil?"),
                "!energetic?"
              ),
              value
            )
          ),
          Q(share_of_biogenic_in_industry_final_demand_crude_oil_non_energetic)
        )
      ),
      BILLIONS
    )
