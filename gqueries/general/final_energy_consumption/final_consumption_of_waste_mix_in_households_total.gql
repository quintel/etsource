# Final consumption of waste mix in households (energetic and non-energetic use combined).
#
# Sector:      Households -- sector == :households
# Carrier:     Waste mix -- waste_mix?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :households"),
            "waste_mix?"
          ),
          value
        )
      ),
      BILLIONS
    )
