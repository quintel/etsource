# Final consumption of liquid biofuels, all sectors (energetic and non-energetic use combined).
#
# Sector:      All sectors
# Carrier:     Liquid biofuels
# Use type:    Total
#
# Exception: includes the biogenic share of crude oil in agriculture, buildings, households, industry.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_liquid_biofuels_in_households_total),
      Q(final_consumption_of_liquid_biofuels_in_buildings_total),
      Q(final_consumption_of_liquid_biofuels_in_national_transport_total),
      Q(final_consumption_of_liquid_biofuels_in_international_transport_total),
      Q(final_consumption_of_liquid_biofuels_in_industry_total),
      Q(final_consumption_of_liquid_biofuels_in_agriculture_total),
      Q(final_consumption_of_liquid_biofuels_in_other_total),
      Q(final_consumption_of_liquid_biofuels_in_energy_total)
    )
