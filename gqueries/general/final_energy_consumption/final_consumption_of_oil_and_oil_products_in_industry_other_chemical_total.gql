# Final consumption of oil and oil products in industry ex. ict and refineries - chemicals (energetic and non-energetic use combined).
#
# Sector:      Industry ex. ICT and refineries - Chemicals -- EG(other_chemical_industry)
# Carrier:     Oil and oil products
# Use type:    Total
#
# Exception: includes the non-biogenic share of crude oil in agriculture, buildings, households, industry.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_oil_and_oil_products_in_industry_other_chemical_energetic),
      Q(final_consumption_of_oil_and_oil_products_in_industry_other_chemical_non_energetic)
    )
