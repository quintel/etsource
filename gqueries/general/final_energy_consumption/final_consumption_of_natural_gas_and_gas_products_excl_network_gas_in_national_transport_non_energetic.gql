# Final consumption of natural gas and gas products excl. network gas in national transport (non-energetic use only).
#
# Sector:      National transport -- sector == :transport
# Carrier:     Natural gas and gas products excl. network gas -- natural_gas? || propane? || lng?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :transport"),
              "natural_gas? || propane? || lng?"
            ),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
