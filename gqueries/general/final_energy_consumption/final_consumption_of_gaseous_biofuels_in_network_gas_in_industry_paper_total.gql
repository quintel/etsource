# Final consumption of gaseous biofuels in network gas in industry ex. ict and refineries - paper (energetic and non-energetic use combined).
#
# Sector:      Industry ex. ICT and refineries - Paper -- EG(paper_industry)
# Carrier:     Gaseous biofuels in network gas
# Use type:    Total
#
# Network gas times the share of gaseous biofuels in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_network_gas_in_industry_paper_total),
      Q(share_of_sustainable_gas_in_gas_network)
    )
