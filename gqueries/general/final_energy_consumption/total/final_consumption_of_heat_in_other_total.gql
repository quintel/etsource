# Final consumption of heat in other (energetic and non-energetic use combined).
#
# Sector:      Other -- sector == :other
# Carrier:     Heat -- steam_hot_water? || useable_heat?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :other"),
            "steam_hot_water? || useable_heat?"
          ),
          value
        )
      ),
      BILLIONS
    )
