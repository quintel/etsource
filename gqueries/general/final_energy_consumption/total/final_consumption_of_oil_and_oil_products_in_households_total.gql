# Final consumption of oil and oil products in households (energetic and non-energetic use combined).
#
# Sector:      Households -- sector == :households
# Carrier:     Oil and oil products
# Use type:    Total
#
# Exception: includes the non-biogenic share of crude oil in agriculture, buildings, households, industry.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_oil_and_oil_products_in_households_energetic)
    )
