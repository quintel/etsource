# Final consumption of electricity in energy (energetic and non-energetic use combined).
#
# Sector:      Energy -- sector == :energy
# Carrier:     Electricity -- electricity?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :energy"),
            "electricity?"
          ),
          value
        )
      ),
      BILLIONS
    )
