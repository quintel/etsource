# Final consumption from households, all carriers (energetic and non-energetic use combined).
#
# Sector:      Households -- sector == :households
# Carrier:     All carriers
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "sector == :households"),
          value
        )
      ),
      BILLIONS
    )
