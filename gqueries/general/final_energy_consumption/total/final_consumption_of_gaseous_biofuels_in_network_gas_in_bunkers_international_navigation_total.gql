# Final consumption of gaseous biofuels in network gas in international transport - international navigation (energetic and non-energetic use combined).
#
# Sector:      International transport - International navigation -- EG(bunkers_international_navigation)
# Carrier:     Gaseous biofuels in network gas
# Use type:    Total
#
# Network gas times the share of gaseous biofuels in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_network_gas_in_bunkers_international_navigation_total),
      Q(share_of_sustainable_gas_in_gas_network)
    )
