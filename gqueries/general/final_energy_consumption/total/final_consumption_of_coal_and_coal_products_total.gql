# Final consumption of coal and coal products, all sectors (energetic and non-energetic use combined).
#
# Sector:      All sectors
# Carrier:     Coal and coal products -- coal? || coal_gas? || cokes? || lignite?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "coal? || coal_gas? || cokes? || lignite?"),
          value
        )
      ),
      BILLIONS
    )
