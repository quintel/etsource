# Final consumption of hydrogen in industry ex. ict and refineries - aluminium (energetic and non-energetic use combined).
#
# Sector:      Industry ex. ICT and refineries - Aluminium -- EG(aluminium_industry)
# Carrier:     Hydrogen -- hydrogen? || liquid_hydrogen? || lohc?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(INTERSECTION(EG(final_demand), EG(aluminium_industry)), "hydrogen? || liquid_hydrogen? || lohc?"),
          value
        )
      ),
      BILLIONS
    )
