# Final consumption of network gas in energy (energetic and non-energetic use combined).
#
# Sector:      Energy -- sector == :energy
# Carrier:     Network gas -- network_gas? || compressed_network_gas?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :energy"),
            "network_gas? || compressed_network_gas?"
          ),
          value
        )
      ),
      BILLIONS
    )
