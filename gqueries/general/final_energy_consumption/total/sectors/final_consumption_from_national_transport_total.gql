# Final consumption from national transport, all carriers (energetic and non-energetic use combined).
#
# Sector:      National transport -- sector == :transport
# Carrier:     All carriers
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "sector == :transport"),
          value
        )
      ),
      BILLIONS
    )
