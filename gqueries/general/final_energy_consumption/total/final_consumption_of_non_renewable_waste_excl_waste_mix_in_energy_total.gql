# Final consumption of non-renewable waste excl. waste mix in energy (energetic and non-energetic use combined).
#
# Sector:      Energy -- sector == :energy
# Carrier:     Non-renewable waste excl. waste mix -- non_biogenic_waste?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :energy"),
            "non_biogenic_waste?"
          ),
          value
        )
      ),
      BILLIONS
    )
