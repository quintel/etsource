# Final consumption of network gas in industry ex. ict and refineries - food (energetic and non-energetic use combined).
#
# Sector:      Industry ex. ICT and refineries - Food -- EG(food_industry)
# Carrier:     Network gas -- network_gas? || compressed_network_gas?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(INTERSECTION(EG(final_demand), EG(food_industry)), "network_gas? || compressed_network_gas?"),
          value
        )
      ),
      BILLIONS
    )
