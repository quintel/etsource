# Final consumption of natural gas and gas products excl. network gas in other (energetic and non-energetic use combined).
#
# Sector:      Other -- sector == :other
# Carrier:     Natural gas and gas products excl. network gas -- natural_gas? || propane? || lng?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :other"),
            "natural_gas? || propane? || lng?"
          ),
          value
        )
      ),
      BILLIONS
    )
