# Final consumption of ammonia in agriculture (energetic and non-energetic use combined).
#
# Sector:      Agriculture -- sector == :agriculture
# Carrier:     Ammonia -- ammonia?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :agriculture"),
            "ammonia?"
          ),
          value
        )
      ),
      BILLIONS
    )
