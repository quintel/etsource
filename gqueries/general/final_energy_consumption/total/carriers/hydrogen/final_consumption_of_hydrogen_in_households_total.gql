# Final consumption of hydrogen in households (energetic and non-energetic use combined).
#
# Sector:      Households -- sector == :households
# Carrier:     Hydrogen -- hydrogen? || liquid_hydrogen? || lohc?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :households"),
            "hydrogen? || liquid_hydrogen? || lohc?"
          ),
          value
        )
      ),
      BILLIONS
    )
