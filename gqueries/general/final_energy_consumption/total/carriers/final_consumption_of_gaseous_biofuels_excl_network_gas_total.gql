# Final consumption of gaseous biofuels excl. network gas, all sectors (energetic and non-energetic use combined).
#
# Sector:      All sectors
# Carrier:     Gaseous biofuels excl. network gas -- biogas? || greengas? || bio_lng?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "biogas? || greengas? || bio_lng?"),
          value
        )
      ),
      BILLIONS
    )
