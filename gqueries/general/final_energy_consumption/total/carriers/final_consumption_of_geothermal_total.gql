# Final consumption of geothermal, all sectors (energetic and non-energetic use combined).
#
# Sector:      All sectors
# Carrier:     Geothermal -- geothermal?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "geothermal?"),
          value
        )
      ),
      BILLIONS
    )
