# Final consumption of non-renewable waste, all sectors (energetic and non-energetic use combined).
#
# Sector:      All sectors
# Carrier:     Non-renewable waste
# Use type:    Total
#
# Exception: includes the share of non-renewable waste in waste mix.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_non_renewable_waste_excl_waste_mix_total),
      Q(final_consumption_of_non_renewable_waste_in_waste_mix_total)
    )
