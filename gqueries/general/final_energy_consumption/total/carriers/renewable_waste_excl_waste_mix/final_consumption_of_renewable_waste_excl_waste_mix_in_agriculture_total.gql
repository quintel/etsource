# Final consumption of renewable waste excl. waste mix in agriculture (energetic and non-energetic use combined).
#
# Sector:      Agriculture -- sector == :agriculture
# Carrier:     Renewable waste excl. waste mix -- biogenic_waste?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :agriculture"),
            "biogenic_waste?"
          ),
          value
        )
      ),
      BILLIONS
    )
