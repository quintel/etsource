# Final consumption of methanol in industry ex. ict and refineries - aluminium (energetic and non-energetic use combined).
#
# Sector:      Industry ex. ICT and refineries - Aluminium -- EG(aluminium_industry)
# Carrier:     Methanol -- methanol?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(INTERSECTION(EG(final_demand), EG(aluminium_industry)), "methanol?"),
          value
        )
      ),
      BILLIONS
    )
