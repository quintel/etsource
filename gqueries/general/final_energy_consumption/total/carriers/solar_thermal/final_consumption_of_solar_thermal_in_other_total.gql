# Final consumption of solar thermal in other (energetic and non-energetic use combined).
#
# Sector:      Other -- sector == :other
# Carrier:     Solar thermal -- solar_thermal?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :other"),
            "solar_thermal?"
          ),
          value
        )
      ),
      BILLIONS
    )
