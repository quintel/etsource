# Final consumption of renewable waste in industry (energetic and non-energetic use combined).
#
# Sector:      Industry -- sector == :industry
# Carrier:     Renewable waste
# Use type:    Total
#
# Exception: includes the share of renewable waste in waste mix.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_renewable_waste_excl_waste_mix_in_industry_total),
      Q(final_consumption_of_renewable_waste_in_waste_mix_in_industry_total)
    )
