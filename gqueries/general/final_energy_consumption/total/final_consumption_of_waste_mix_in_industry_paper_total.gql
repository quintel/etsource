# Final consumption of waste mix in industry ex. ict and refineries - paper (energetic and non-energetic use combined).
#
# Sector:      Industry ex. ICT and refineries - Paper -- EG(paper_industry)
# Carrier:     Waste mix -- waste_mix?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(INTERSECTION(EG(final_demand), EG(paper_industry)), "waste_mix?"),
          value
        )
      ),
      BILLIONS
    )
