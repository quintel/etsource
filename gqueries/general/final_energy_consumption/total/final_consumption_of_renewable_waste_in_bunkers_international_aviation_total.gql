# Final consumption of renewable waste in international transport - international aviation (energetic and non-energetic use combined).
#
# Sector:      International transport - International aviation -- EG(bunkers_international_aviation)
# Carrier:     Renewable waste
# Use type:    Total
#
# Exception: includes the share of renewable waste in waste mix.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_renewable_waste_excl_waste_mix_in_bunkers_international_aviation_total),
      Q(final_consumption_of_renewable_waste_in_waste_mix_in_bunkers_international_aviation_total)
    )
