# Final consumption of natural gas and gas products excl. network gas, all sectors (energetic and non-energetic use combined).
#
# Sector:      All sectors
# Carrier:     Natural gas and gas products excl. network gas -- natural_gas? || propane? || lng?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "natural_gas? || propane? || lng?"),
          value
        )
      ),
      BILLIONS
    )
