# Final consumption of heat, all sectors (energetic use only).
#
# Sector:      All sectors
# Carrier:     Heat -- steam_hot_water? || useable_heat?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "steam_hot_water? || useable_heat?"),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
