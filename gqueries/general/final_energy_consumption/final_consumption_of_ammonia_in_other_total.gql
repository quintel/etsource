# Final consumption of ammonia in other (energetic and non-energetic use combined).
#
# Sector:      Other -- sector == :other
# Carrier:     Ammonia -- ammonia?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :other"),
            "ammonia?"
          ),
          value
        )
      ),
      BILLIONS
    )
