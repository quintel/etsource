# Final consumption of solid biofuels in international transport - international aviation (energetic and non-energetic use combined).
#
# Sector:      International transport - International aviation -- EG(bunkers_international_aviation)
# Carrier:     Solid biofuels -- wood_pellets? || torrefied_biomass_pellets? || wet_biomass? || dry_biomass?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(INTERSECTION(EG(final_demand), EG(bunkers_international_aviation)), "wood_pellets? || torrefied_biomass_pellets? || wet_biomass? || dry_biomass?"),
          value
        )
      ),
      BILLIONS
    )
