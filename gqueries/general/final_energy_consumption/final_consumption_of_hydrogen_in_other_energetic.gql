# Final consumption of hydrogen in other (energetic use only).
#
# Sector:      Other -- sector == :other
# Carrier:     Hydrogen -- hydrogen? || liquid_hydrogen? || lohc?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :other"),
              "hydrogen? || liquid_hydrogen? || lohc?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
