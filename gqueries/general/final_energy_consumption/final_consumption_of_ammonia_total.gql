# Final consumption of ammonia, all sectors (energetic and non-energetic use combined).
#
# Sector:      All sectors
# Carrier:     Ammonia -- ammonia?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "ammonia?"),
          value
        )
      ),
      BILLIONS
    )
