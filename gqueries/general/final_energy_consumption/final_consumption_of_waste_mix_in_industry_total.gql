# Final consumption of waste mix in industry (energetic and non-energetic use combined).
#
# Sector:      Industry -- sector == :industry
# Carrier:     Waste mix -- waste_mix?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :industry"),
            "waste_mix?"
          ),
          value
        )
      ),
      BILLIONS
    )
