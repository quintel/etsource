# Final consumption of waste mix in other (energetic and non-energetic use combined).
#
# Sector:      Other -- sector == :other
# Carrier:     Waste mix -- waste_mix?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :other"),
            "waste_mix?"
          ),
          value
        )
      ),
      BILLIONS
    )
