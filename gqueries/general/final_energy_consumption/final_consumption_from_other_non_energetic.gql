# Final consumption from other, all carriers (non-energetic use only).
#
# Sector:      Other -- sector == :other
# Carrier:     All carriers
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :other"),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
