# Final consumption of gaseous biofuels excl. network gas in agriculture (energetic use only).
#
# Sector:      Agriculture -- sector == :agriculture
# Carrier:     Gaseous biofuels excl. network gas -- biogas? || greengas? || bio_lng?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :agriculture"),
              "biogas? || greengas? || bio_lng?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
