# Final consumption of renewable waste in waste mix in national transport (energetic and non-energetic use combined).
#
# Sector:      National transport -- sector == :transport
# Carrier:     Renewable waste in waste mix
# Use type:    Total
#
# Waste mix times the share of renewable waste in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_waste_mix_in_national_transport_total),
      Q(share_of_biogenic_waste_in_waste_mix)
    )
