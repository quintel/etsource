# Final consumption of renewable waste excl. waste mix in industry ict (energetic and non-energetic use combined).
#
# Sector:      Industry ICT -- EG(ict_industry)
# Carrier:     Renewable waste excl. waste mix -- biogenic_waste?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(INTERSECTION(EG(final_demand), EG(ict_industry)), "biogenic_waste?"),
          value
        )
      ),
      BILLIONS
    )
