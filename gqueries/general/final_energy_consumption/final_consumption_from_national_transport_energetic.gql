# Final consumption from national transport, all carriers (energetic use only).
#
# Sector:      National transport -- sector == :transport
# Carrier:     All carriers
# Use type:    Energetic -- energetic?
#
# Generated by generate_fec_query_set.py from final_energy_consumption_query_set_v3_*.csv.
# Do not edit by hand -- regenerate instead.

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :transport"),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
