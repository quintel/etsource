# Final consumption of methanol in households (energetic and non-energetic use combined).
#
# Sector:      Households -- sector == :households
# Carrier:     Methanol -- methanol?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :households"),
            "methanol?"
          ),
          value
        )
      ),
      BILLIONS
    )
