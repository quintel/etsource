# Final consumption of electricity in national transport (energetic use only).
#
# Sector:      National transport -- sector == :transport
# Carrier:     Electricity -- electricity?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :transport"),
              "electricity?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
