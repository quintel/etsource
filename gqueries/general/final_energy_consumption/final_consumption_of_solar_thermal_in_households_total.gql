# Final consumption of solar thermal in households (energetic and non-energetic use combined).
#
# Sector:      Households -- sector == :households
# Carrier:     Solar thermal -- solar_thermal?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :households"),
            "solar_thermal?"
          ),
          value
        )
      ),
      BILLIONS
    )
