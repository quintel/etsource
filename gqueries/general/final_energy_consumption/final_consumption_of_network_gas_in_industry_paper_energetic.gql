# Final consumption of network gas in industry ex. ict and refineries - paper (energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Paper -- EG(paper_industry)
# Carrier:     Network gas -- network_gas? || compressed_network_gas?
# Use type:    Energetic -- energetic?
#
# Generated by generate_fec_query_set.py from final_energy_consumption_query_set_v3_*.csv.
# Do not edit by hand -- regenerate instead.

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(paper_industry)), "network_gas? || compressed_network_gas?"),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
