# Final consumption of heat, all sectors (energetic and non-energetic use combined).
#
# Sector:      All sectors
# Carrier:     Heat -- steam_hot_water? || useable_heat?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "steam_hot_water? || useable_heat?"),
          value
        )
      ),
      BILLIONS
    )
