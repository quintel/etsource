# Final consumption of hydrogen, all sectors (non-energetic use only).
#
# Sector:      All sectors
# Carrier:     Hydrogen -- hydrogen? || liquid_hydrogen? || lohc?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "hydrogen? || liquid_hydrogen? || lohc?"),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
