# Final consumption of natural gas and gas products excl. network gas in industry ex. ict and refineries - fertilizers (non-energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Fertilizers -- EG(fertilizers_industry)
# Carrier:     Natural gas and gas products excl. network gas -- natural_gas? || propane? || lng?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(fertilizers_industry)), "natural_gas? || propane? || lng?"),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
