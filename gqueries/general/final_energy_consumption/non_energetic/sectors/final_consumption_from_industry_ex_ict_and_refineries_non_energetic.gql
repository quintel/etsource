# Final consumption from industry ex. ict and refineries, all carriers (non-energetic use only).
#
# Sector:      Industry ex. ICT and refineries -- sector == :industry minus EG(ict_industry), EG(refineries_industry)
# Carrier:     All carriers
# Use type:    Non-energetic -- !energetic?
#
# Exception: industry minus industry refineries.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_from_industry_non_energetic),
      NEG(Q(final_consumption_from_industry_refineries_non_energetic))
    )
