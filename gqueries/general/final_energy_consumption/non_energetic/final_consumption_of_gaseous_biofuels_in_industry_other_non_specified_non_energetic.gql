# Final consumption of gaseous biofuels in industry ex. ict and refineries - other (non-energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Other -- EG(other_non_specified_industry)
# Carrier:     Gaseous biofuels
# Use type:    Non-energetic -- !energetic?
#
# Exception: includes the share of gaseous biofuels in network gas.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_gaseous_biofuels_excl_network_gas_in_industry_other_non_specified_non_energetic),
      Q(final_consumption_of_gaseous_biofuels_in_network_gas_in_industry_other_non_specified_non_energetic)
    )
