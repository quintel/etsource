# Final consumption of electricity in industry ex. ict and refineries - fertilizers (non-energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Fertilizers -- EG(fertilizers_industry)
# Carrier:     Electricity -- electricity?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(fertilizers_industry)), "electricity?"),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
