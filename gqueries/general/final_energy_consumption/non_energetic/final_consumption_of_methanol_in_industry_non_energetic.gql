# Final consumption of methanol in industry (non-energetic use only).
#
# Sector:      Industry -- sector == :industry
# Carrier:     Methanol -- methanol?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :industry"),
              "methanol?"
            ),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
