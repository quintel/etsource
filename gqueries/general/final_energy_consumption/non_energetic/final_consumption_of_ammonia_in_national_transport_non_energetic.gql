# Final consumption of ammonia in national transport (non-energetic use only).
#
# Sector:      National transport -- sector == :transport
# Carrier:     Ammonia -- ammonia?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :transport"),
              "ammonia?"
            ),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
