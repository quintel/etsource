# Final consumption of non-renewable waste in waste mix in industry ex. ict and refineries - fertilizers (non-energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Fertilizers -- EG(fertilizers_industry)
# Carrier:     Non-renewable waste in waste mix
# Use type:    Non-energetic -- !energetic?
#
# Waste mix times the share of non-renewable waste in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_waste_mix_in_industry_fertilizers_non_energetic),
      Q(share_of_non_biogenic_waste_in_waste_mix)
    )
