# Final consumption of heat in industry (non-energetic use only).
#
# Sector:      Industry -- sector == :industry
# Carrier:     Heat -- steam_hot_water? || useable_heat?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :industry"),
              "steam_hot_water? || useable_heat?"
            ),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
