# Final consumption of heat in industry ex. ict and refineries - chemicals (non-energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Chemicals -- EG(other_chemical_industry)
# Carrier:     Heat -- steam_hot_water? || useable_heat?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(other_chemical_industry)), "steam_hot_water? || useable_heat?"),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
