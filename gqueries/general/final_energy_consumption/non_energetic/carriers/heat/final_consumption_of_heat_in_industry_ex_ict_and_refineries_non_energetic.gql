# Final consumption of heat in industry ex. ict and refineries (non-energetic use only).
#
# Sector:      Industry ex. ICT and refineries -- sector == :industry minus EG(ict_industry), EG(refineries_industry)
# Carrier:     Heat
# Use type:    Non-energetic -- !energetic?
#
# Exception: industry minus industry refineries.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_heat_in_industry_non_energetic),
      NEG(Q(final_consumption_of_heat_in_industry_refineries_non_energetic))
    )
