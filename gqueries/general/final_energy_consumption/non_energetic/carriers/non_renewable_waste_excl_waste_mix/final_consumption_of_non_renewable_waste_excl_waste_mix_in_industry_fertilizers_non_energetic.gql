# Final consumption of non-renewable waste excl. waste mix in industry ex. ict and refineries - fertilizers (non-energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Fertilizers -- EG(fertilizers_industry)
# Carrier:     Non-renewable waste excl. waste mix -- non_biogenic_waste?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(fertilizers_industry)), "non_biogenic_waste?"),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
