# Final consumption of renewable waste in industry ex. ict and refineries - other (non-energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Other -- EG(other_non_specified_industry)
# Carrier:     Renewable waste
# Use type:    Non-energetic -- !energetic?
#
# Exception: includes the share of renewable waste in waste mix.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_renewable_waste_excl_waste_mix_in_industry_other_non_specified_non_energetic),
      Q(final_consumption_of_renewable_waste_in_waste_mix_in_industry_other_non_specified_non_energetic)
    )
