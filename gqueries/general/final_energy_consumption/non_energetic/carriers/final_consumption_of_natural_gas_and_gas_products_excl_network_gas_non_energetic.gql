# Final consumption of natural gas and gas products excl. network gas, all sectors (non-energetic use only).
#
# Sector:      All sectors
# Carrier:     Natural gas and gas products excl. network gas -- natural_gas? || propane? || lng?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "natural_gas? || propane? || lng?"),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
