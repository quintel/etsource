# Final consumption of gaseous biofuels in network gas in other (non-energetic use only).
#
# Sector:      Other -- sector == :other
# Carrier:     Gaseous biofuels in network gas
# Use type:    Non-energetic -- !energetic?
#
# Network gas times the share of gaseous biofuels in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_network_gas_in_other_non_energetic),
      Q(share_of_sustainable_gas_in_gas_network)
    )
