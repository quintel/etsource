# Final consumption of non-renewable waste in other (non-energetic use only).
#
# Sector:      Other -- sector == :other
# Carrier:     Non-renewable waste
# Use type:    Non-energetic -- !energetic?
#
# Exception: includes the share of non-renewable waste in waste mix.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_non_renewable_waste_excl_waste_mix_in_other_non_energetic),
      Q(final_consumption_of_non_renewable_waste_in_waste_mix_in_other_non_energetic)
    )
