# Final consumption of electricity, all sectors (energetic and non-energetic use combined).
#
# Sector:      All sectors
# Carrier:     Electricity -- electricity?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "electricity?"),
          value
        )
      ),
      BILLIONS
    )
