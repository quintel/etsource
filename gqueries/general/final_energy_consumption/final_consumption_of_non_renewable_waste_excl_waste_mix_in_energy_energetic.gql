# Final consumption of non-renewable waste excl. waste mix in energy (energetic use only).
#
# Sector:      Energy -- sector == :energy
# Carrier:     Non-renewable waste excl. waste mix -- non_biogenic_waste?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :energy"),
              "non_biogenic_waste?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
