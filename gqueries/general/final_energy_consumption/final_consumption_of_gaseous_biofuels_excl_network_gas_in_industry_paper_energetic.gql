# Final consumption of gaseous biofuels excl. network gas in industry ex. ict and refineries - paper (energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Paper -- EG(paper_industry)
# Carrier:     Gaseous biofuels excl. network gas -- biogas? || greengas? || bio_lng?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(paper_industry)), "biogas? || greengas? || bio_lng?"),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
