# Final consumption of non-renewable waste in national transport (energetic and non-energetic use combined).
#
# Sector:      National transport -- sector == :transport
# Carrier:     Non-renewable waste
# Use type:    Total
#
# Exception: includes the share of non-renewable waste in waste mix.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_non_renewable_waste_excl_waste_mix_in_national_transport_total),
      Q(final_consumption_of_non_renewable_waste_in_waste_mix_in_national_transport_total)
    )
