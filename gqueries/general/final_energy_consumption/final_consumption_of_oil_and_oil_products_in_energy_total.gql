# Final consumption of oil and oil products in energy (energetic and non-energetic use combined).
#
# Sector:      Energy -- sector == :energy
# Carrier:     Oil and oil products -- crude_oil? || gasoline? || diesel? || lpg? || kerosene? || heavy_fuel_oil? || naphtha? || refinery_gas? || pyrolysis_oil?
# Use type:    Total
#
# Generated by generate_fec_query_set.py from final_energy_consumption_query_set_v3_*.csv.
# Do not edit by hand -- regenerate instead.

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :energy"),
            "crude_oil? || gasoline? || diesel? || lpg? || kerosene? || heavy_fuel_oil? || naphtha? || refinery_gas? || pyrolysis_oil?"
          ),
          value
        )
      ),
      BILLIONS
    )
