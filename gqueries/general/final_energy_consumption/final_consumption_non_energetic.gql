# Final consumption, all sectors and all carriers (non-energetic use only).
#
# Sector:      All sectors
# Carrier:     All carriers
# Use type:    Non-energetic -- !energetic?
#
# Generated by generate_fec_query_set.py from final_energy_consumption_query_set_v3_*.csv.
# Do not edit by hand -- regenerate instead.

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "!energetic?"),
          value
