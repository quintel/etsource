# Final consumption of gaseous biofuels, all sectors (energetic use only).
#
# Sector:      All sectors
# Carrier:     Gaseous biofuels
# Use type:    Energetic -- energetic?
#
# Exception: includes the share of gaseous biofuels in network gas.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_gaseous_biofuels_excl_network_gas_energetic),
      Q(final_consumption_of_gaseous_biofuels_in_network_gas_energetic)
    )
