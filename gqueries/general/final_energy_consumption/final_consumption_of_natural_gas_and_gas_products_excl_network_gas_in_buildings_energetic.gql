# Final consumption of natural gas and gas products excl. network gas in buildings (energetic use only).
#
# Sector:      Buildings -- sector == :buildings
# Carrier:     Natural gas and gas products excl. network gas -- natural_gas? || propane? || lng?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :buildings"),
              "natural_gas? || propane? || lng?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
