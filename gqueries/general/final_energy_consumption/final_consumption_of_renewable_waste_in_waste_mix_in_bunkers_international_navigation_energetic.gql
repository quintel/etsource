# Final consumption of renewable waste in waste mix in international transport - international navigation (energetic use only).
#
# Sector:      International transport - International navigation -- EG(bunkers_international_navigation)
# Carrier:     Renewable waste in waste mix
# Use type:    Energetic -- energetic?
#
# Waste mix times the share of renewable waste in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_waste_mix_in_bunkers_international_navigation_energetic),
      Q(share_of_biogenic_waste_in_waste_mix)
    )
