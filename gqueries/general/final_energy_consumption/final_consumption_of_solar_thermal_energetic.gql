# Final consumption of solar thermal, all sectors (energetic use only).
#
# Sector:      All sectors
# Carrier:     Solar thermal -- solar_thermal?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "solar_thermal?"),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
