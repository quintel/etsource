# Final consumption from international transport - international navigation, all carriers (energetic and non-energetic use combined).
#
# Sector:      International transport - International navigation -- EG(bunkers_international_navigation)
# Carrier:     All carriers
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          INTERSECTION(EG(final_demand), EG(bunkers_international_navigation)),
          value
        )
      ),
      BILLIONS
    )
