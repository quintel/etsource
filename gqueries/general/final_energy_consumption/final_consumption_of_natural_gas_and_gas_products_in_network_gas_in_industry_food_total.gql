# Final consumption of natural gas and gas products in network gas in industry ex. ict and refineries - food (energetic and non-energetic use combined).
#
# Sector:      Industry ex. ICT and refineries - Food -- EG(food_industry)
# Carrier:     Natural gas and gas products in network gas
# Use type:    Total
#
# Network gas times the share of natural gas and gas products in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_network_gas_in_industry_food_total),
      Q(share_of_fossil_gas_in_gas_network)
    )
