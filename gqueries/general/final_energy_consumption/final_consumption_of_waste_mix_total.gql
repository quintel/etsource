# Final consumption of waste mix, all sectors (energetic and non-energetic use combined).
#
# Sector:      All sectors
# Carrier:     Waste mix -- waste_mix?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "waste_mix?"),
          value
        )
      ),
      BILLIONS
    )
