# Final consumption of non-renewable waste in waste mix in households (energetic use only).
#
# Sector:      Households -- sector == :households
# Carrier:     Non-renewable waste in waste mix
# Use type:    Energetic -- energetic?
#
# Waste mix times the share of non-renewable waste in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_waste_mix_in_households_energetic),
      Q(share_of_non_biogenic_waste_in_waste_mix)
    )
