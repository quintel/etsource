# Final consumption of non-renewable waste in waste mix in agriculture (energetic use only).
#
# Sector:      Agriculture -- sector == :agriculture
# Carrier:     Non-renewable waste in waste mix
# Use type:    Energetic -- energetic?
#
# Waste mix times the share of non-renewable waste in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_waste_mix_in_agriculture_energetic),
      Q(share_of_non_biogenic_waste_in_waste_mix)
    )
