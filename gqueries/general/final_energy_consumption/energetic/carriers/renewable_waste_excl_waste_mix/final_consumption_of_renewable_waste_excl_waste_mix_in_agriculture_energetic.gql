# Final consumption of renewable waste excl. waste mix in agriculture (energetic use only).
#
# Sector:      Agriculture -- sector == :agriculture
# Carrier:     Renewable waste excl. waste mix -- biogenic_waste?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :agriculture"),
              "biogenic_waste?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
