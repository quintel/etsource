# Final consumption of renewable waste in international transport (energetic use only).
#
# Sector:      International transport -- sector == :bunkers
# Carrier:     Renewable waste
# Use type:    Energetic -- energetic?
#
# Exception: includes the share of renewable waste in waste mix.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_renewable_waste_excl_waste_mix_in_international_transport_energetic),
      Q(final_consumption_of_renewable_waste_in_waste_mix_in_international_transport_energetic)
    )
