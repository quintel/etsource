# Final consumption of renewable waste in buildings (energetic use only).
#
# Sector:      Buildings -- sector == :buildings
# Carrier:     Renewable waste
# Use type:    Energetic -- energetic?
#
# Exception: includes the share of renewable waste in waste mix.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_renewable_waste_excl_waste_mix_in_buildings_energetic),
      Q(final_consumption_of_renewable_waste_in_waste_mix_in_buildings_energetic)
    )
