# Final consumption of solar thermal in industry (energetic use only).
#
# Sector:      Industry -- sector == :industry
# Carrier:     Solar thermal -- solar_thermal?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :industry"),
              "solar_thermal?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
