# Final consumption of waste mix in industry ex. ict and refineries - other metals (energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Other metals -- EG(other_metals_industry)
# Carrier:     Waste mix -- waste_mix?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(other_metals_industry)), "waste_mix?"),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
