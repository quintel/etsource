# Final consumption of oil and oil products, all sectors (energetic use only).
#
# Sector:      All sectors
# Carrier:     Oil and oil products
# Use type:    Energetic -- energetic?
#
# Exception: includes the non-biogenic share of crude oil in agriculture, buildings, households, industry.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_oil_and_oil_products_in_households_energetic),
      Q(final_consumption_of_oil_and_oil_products_in_buildings_energetic),
      Q(final_consumption_of_oil_and_oil_products_in_national_transport_energetic),
      Q(final_consumption_of_oil_and_oil_products_in_international_transport_energetic),
      Q(final_consumption_of_oil_and_oil_products_in_industry_energetic),
      Q(final_consumption_of_oil_and_oil_products_in_agriculture_energetic),
      Q(final_consumption_of_oil_and_oil_products_in_other_energetic),
      Q(final_consumption_of_oil_and_oil_products_in_energy_energetic)
    )
