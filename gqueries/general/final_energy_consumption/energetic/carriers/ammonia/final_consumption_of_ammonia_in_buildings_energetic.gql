# Final consumption of ammonia in buildings (energetic use only).
#
# Sector:      Buildings -- sector == :buildings
# Carrier:     Ammonia -- ammonia?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :buildings"),
              "ammonia?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
