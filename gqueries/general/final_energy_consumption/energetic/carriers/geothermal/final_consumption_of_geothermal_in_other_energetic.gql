# Final consumption of geothermal in other (energetic use only).
#
# Sector:      Other -- sector == :other
# Carrier:     Geothermal -- geothermal?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :other"),
              "geothermal?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
