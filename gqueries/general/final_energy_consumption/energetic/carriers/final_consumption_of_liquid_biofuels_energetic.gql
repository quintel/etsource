# Final consumption of liquid biofuels, all sectors (energetic use only).
#
# Sector:      All sectors
# Carrier:     Liquid biofuels
# Use type:    Energetic -- energetic?
#
# Exception: includes the biogenic share of crude oil in agriculture, buildings, households, industry.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_liquid_biofuels_in_households_energetic),
      Q(final_consumption_of_liquid_biofuels_in_buildings_energetic),
      Q(final_consumption_of_liquid_biofuels_in_national_transport_energetic),
      Q(final_consumption_of_liquid_biofuels_in_international_transport_energetic),
      Q(final_consumption_of_liquid_biofuels_in_industry_energetic),
      Q(final_consumption_of_liquid_biofuels_in_agriculture_energetic),
      Q(final_consumption_of_liquid_biofuels_in_other_energetic),
      Q(final_consumption_of_liquid_biofuels_in_energy_energetic)
    )
