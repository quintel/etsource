# Final consumption of methanol in buildings (energetic use only).
#
# Sector:      Buildings -- sector == :buildings
# Carrier:     Methanol -- methanol?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :buildings"),
              "methanol?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
