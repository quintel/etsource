# Final consumption of heat in agriculture (energetic use only).
#
# Sector:      Agriculture -- sector == :agriculture
# Carrier:     Heat -- steam_hot_water? || useable_heat?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :agriculture"),
              "steam_hot_water? || useable_heat?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
