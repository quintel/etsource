# Final consumption of solar thermal in energy (energetic use only).
#
# Sector:      Energy -- sector == :energy
# Carrier:     Solar thermal -- solar_thermal?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :energy"),
              "solar_thermal?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
