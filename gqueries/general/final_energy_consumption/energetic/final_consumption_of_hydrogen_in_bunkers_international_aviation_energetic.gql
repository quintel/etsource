# Final consumption of hydrogen in international transport - international aviation (energetic use only).
#
# Sector:      International transport - International aviation -- EG(bunkers_international_aviation)
# Carrier:     Hydrogen -- hydrogen? || liquid_hydrogen? || lohc?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(bunkers_international_aviation)), "hydrogen? || liquid_hydrogen? || lohc?"),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
