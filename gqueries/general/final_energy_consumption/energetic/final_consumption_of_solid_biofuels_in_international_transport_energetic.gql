# Final consumption of solid biofuels in international transport (energetic use only).
#
# Sector:      International transport -- sector == :bunkers
# Carrier:     Solid biofuels -- wood_pellets? || torrefied_biomass_pellets? || wet_biomass? || dry_biomass?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :bunkers"),
              "wood_pellets? || torrefied_biomass_pellets? || wet_biomass? || dry_biomass?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
