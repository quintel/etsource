# Final consumption of gaseous biofuels in industry ex. ict and refineries - other metals (energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Other metals -- EG(other_metals_industry)
# Carrier:     Gaseous biofuels
# Use type:    Energetic -- energetic?
#
# Exception: includes the share of gaseous biofuels in network gas.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_gaseous_biofuels_excl_network_gas_in_industry_other_metals_energetic),
      Q(final_consumption_of_gaseous_biofuels_in_network_gas_in_industry_other_metals_energetic)
    )
