# Final consumption of hydrogen in industry ex. ict and refineries - other metals (energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Other metals -- EG(other_metals_industry)
# Carrier:     Hydrogen -- hydrogen? || liquid_hydrogen? || lohc?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(other_metals_industry)), "hydrogen? || liquid_hydrogen? || lohc?"),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
