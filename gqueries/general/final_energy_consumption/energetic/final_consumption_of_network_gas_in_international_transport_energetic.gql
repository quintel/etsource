# Final consumption of network gas in international transport (energetic use only).
#
# Sector:      International transport -- sector == :bunkers
# Carrier:     Network gas -- network_gas? || compressed_network_gas?
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :bunkers"),
              "network_gas? || compressed_network_gas?"
            ),
            "energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
