# Final consumption, all sectors and all carriers (energetic use only).
#
# Sector:      All sectors
# Carrier:     All carriers
# Use type:    Energetic -- energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "energetic?"),
          value
        )
      ),
      BILLIONS
    )
