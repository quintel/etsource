# Final consumption of gaseous biofuels in network gas in households (energetic use only).
#
# Sector:      Households -- sector == :households
# Carrier:     Gaseous biofuels in network gas
# Use type:    Energetic -- energetic?
#
# Network gas times the share of gaseous biofuels in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_network_gas_in_households_energetic),
      Q(share_of_sustainable_gas_in_gas_network)
    )
