# Final consumption of solid biofuels in industry (non-energetic use only).
#
# Sector:      Industry -- sector == :industry
# Carrier:     Solid biofuels -- wood_pellets? || torrefied_biomass_pellets? || wet_biomass? || dry_biomass?
# Use type:    Non-energetic -- !energetic?
#
# Generated by generate_fec_query_set.py from final_energy_consumption_query_set_v3_*.csv.
# Do not edit by hand -- regenerate instead.

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :industry"),
              "wood_pellets? || torrefied_biomass_pellets? || wet_biomass? || dry_biomass?"
            ),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
