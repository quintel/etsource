# Final consumption of liquid biofuels in industry (energetic and non-energetic use combined).
#
# Sector:      Industry -- sector == :industry
# Carrier:     Liquid biofuels
# Use type:    Total
#
# Exception: includes the biogenic share of crude oil in agriculture, buildings, households, industry.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_liquid_biofuels_in_industry_energetic),
      Q(final_consumption_of_liquid_biofuels_in_industry_non_energetic)
    )
