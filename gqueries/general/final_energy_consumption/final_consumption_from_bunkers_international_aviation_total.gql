# Final consumption from international transport - international aviation, all carriers (energetic and non-energetic use combined).
#
# Sector:      International transport - International aviation -- EG(bunkers_international_aviation)
# Carrier:     All carriers
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          INTERSECTION(EG(final_demand), EG(bunkers_international_aviation)),
          value
        )
      ),
      BILLIONS
    )
