# Final consumption of non-renewable waste in waste mix in other (non-energetic use only).
#
# Sector:      Other -- sector == :other
# Carrier:     Non-renewable waste in waste mix
# Use type:    Non-energetic -- !energetic?
#
# Waste mix times the share of non-renewable waste in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_waste_mix_in_other_non_energetic),
      Q(share_of_non_biogenic_waste_in_waste_mix)
    )
