# Final consumption of methanol in industry (energetic and non-energetic use combined).
#
# Sector:      Industry -- sector == :industry
# Carrier:     Methanol -- methanol?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :industry"),
            "methanol?"
          ),
          value
        )
      ),
      BILLIONS
    )
