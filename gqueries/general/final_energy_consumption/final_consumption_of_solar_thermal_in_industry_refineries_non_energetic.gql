# Final consumption of solar thermal in industry refineries (non-energetic use only).
#
# Sector:      Industry Refineries -- EG(refineries_industry)
# Carrier:     Solar thermal -- solar_thermal?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(INTERSECTION(EG(final_demand), EG(refineries_industry)), "solar_thermal?"),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
