# Final consumption of oil and oil products in industry (non-energetic use only).
#
# Sector:      Industry -- sector == :industry
# Carrier:     Oil and oil products -- gasoline? || diesel? || lpg? || kerosene? || heavy_fuel_oil? || naphtha? || refinery_gas? || pyrolysis_oil? + crude_oil? x Q(share_of_non_biogenic_in_industry_final_demand_crude_oil_non_energetic)
# Use type:    Non-energetic -- !energetic?
#
# Exception: includes the non-biogenic share of crude oil in agriculture, buildings, households, industry.
#
# Generated by generate_fec_query_set.py from final_energy_consumption_query_set_v3_*.csv.
# Do not edit by hand -- regenerate instead.

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :industry"),
              "gasoline? || diesel? || lpg? || kerosene? || heavy_fuel_oil? || naphtha? || refinery_gas? || pyrolysis_oil?"
            ),
            "!energetic?"
          ),
          value
        ),
        PRODUCT(
          SUM(
            V(
              FILTER(
                FILTER(
                  FILTER(EG(final_demand), "sector == :industry"),
                  "crude_oil?"
                ),
                "!energetic?"
              ),
              value
            )
          ),
          Q(share_of_non_biogenic_in_industry_final_demand_crude_oil_non_energetic)
        )
      ),
      BILLIONS
    )
