# Final consumption of solid biofuels in national transport (energetic and non-energetic use combined).
#
# Sector:      National transport -- sector == :transport
# Carrier:     Solid biofuels -- wood_pellets? || torrefied_biomass_pellets? || wet_biomass? || dry_biomass?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(EG(final_demand), "sector == :transport"),
            "wood_pellets? || torrefied_biomass_pellets? || wet_biomass? || dry_biomass?"
          ),
          value
        )
      ),
      BILLIONS
    )
