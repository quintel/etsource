# Final consumption from international transport, all carriers (energetic and non-energetic use combined).
#
# Sector:      International transport -- sector == :bunkers
# Carrier:     All carriers
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "sector == :bunkers"),
          value
        )
      ),
      BILLIONS
    )
