# Final consumption of natural gas and gas products in network gas in buildings (energetic and non-energetic use combined).
#
# Sector:      Buildings -- sector == :buildings
# Carrier:     Natural gas and gas products in network gas
# Use type:    Total
#
# Network gas times the share of natural gas and gas products in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_network_gas_in_buildings_total),
      Q(share_of_fossil_gas_in_gas_network)
    )
