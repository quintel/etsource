# Final consumption from industry ex. ict and refineries - other, all carriers (non-energetic use only).
#
# Sector:      Industry ex. ICT and refineries - Other -- EG(other_non_specified_industry)
# Carrier:     All carriers
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(INTERSECTION(EG(final_demand), EG(other_non_specified_industry)), "!energetic?"),
          value
        )
      ),
      BILLIONS
    )
