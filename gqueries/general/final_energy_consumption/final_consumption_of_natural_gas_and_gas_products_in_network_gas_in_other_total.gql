# Final consumption of natural gas and gas products in network gas in other (energetic and non-energetic use combined).
#
# Sector:      Other -- sector == :other
# Carrier:     Natural gas and gas products in network gas
# Use type:    Total
#
# Network gas times the share of natural gas and gas products in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_network_gas_in_other_total),
      Q(share_of_fossil_gas_in_gas_network)
    )
