# Final consumption of gaseous biofuels excl. network gas in other (non-energetic use only).
#
# Sector:      Other -- sector == :other
# Carrier:     Gaseous biofuels excl. network gas -- biogas? || greengas? || bio_lng?
# Use type:    Non-energetic -- !energetic?

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(
            FILTER(
              FILTER(EG(final_demand), "sector == :other"),
              "biogas? || greengas? || bio_lng?"
            ),
            "!energetic?"
          ),
          value
        )
      ),
      BILLIONS
    )
