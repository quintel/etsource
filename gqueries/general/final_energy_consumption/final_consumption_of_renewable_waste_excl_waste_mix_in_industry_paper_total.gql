# Final consumption of renewable waste excl. waste mix in industry ex. ict and refineries - paper (energetic and non-energetic use combined).
#
# Sector:      Industry ex. ICT and refineries - Paper -- EG(paper_industry)
# Carrier:     Renewable waste excl. waste mix -- biogenic_waste?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(INTERSECTION(EG(final_demand), EG(paper_industry)), "biogenic_waste?"),
          value
        )
      ),
      BILLIONS
    )
