# Final consumption of renewable waste in waste mix in industry ex. ict and refineries - fertilizers (energetic and non-energetic use combined).
#
# Sector:      Industry ex. ICT and refineries - Fertilizers -- EG(fertilizers_industry)
# Carrier:     Renewable waste in waste mix
# Use type:    Total
#
# Waste mix times the share of renewable waste in it.

- unit = PJ
- query =
    PRODUCT(
      Q(final_consumption_of_waste_mix_in_industry_fertilizers_total),
      Q(share_of_biogenic_waste_in_waste_mix)
    )
