# Final consumption of liquid biofuels in agriculture (energetic and non-energetic use combined).
#
# Sector:      Agriculture -- sector == :agriculture
# Carrier:     Liquid biofuels
# Use type:    Total
#
# Exception: includes the biogenic share of crude oil in agriculture, buildings, households, industry.

- unit = PJ
- query =
    SUM(
      Q(final_consumption_of_liquid_biofuels_in_agriculture_energetic)
    )
