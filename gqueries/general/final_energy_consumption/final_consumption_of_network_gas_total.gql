# Final consumption of network gas, all sectors (energetic and non-energetic use combined).
#
# Sector:      All sectors
# Carrier:     Network gas -- network_gas? || compressed_network_gas?
# Use type:    Total

- unit = PJ
- query =
    DIVIDE(
      SUM(
        V(
          FILTER(EG(final_demand), "network_gas? || compressed_network_gas?"),
          value
        )
      ),
      BILLIONS
    )
