# Battery losses: electricity input minus the electricity actually discharged.
# The output curve is used because output_of_electricity does not subtract losses and
# unused electricity after the merit order calculation.

- query =
    V(energy_flexibility_wind_batteries_electricity, input_of_electricity) -
    PRODUCT(SUM(V(energy_flexibility_wind_batteries_electricity, electricity_output_curve)),MJ_PER_MWH)
- unit = MJ
