# Curtailed electricity: the demand of the grid curtailment node and the curtailment
# nodes of solar and wind battery parks.
# Demand is used instead of primary demand of electricity, because the primary demand
# of grid curtailment excludes the share produced from other carriers, such as natural gas.

- query =
    SUM(
      V(
        energy_flexibility_curtailment_electricity,
        energy_battery_curtailed_solar_electricity,
        energy_battery_curtailed_wind_electricity,
        demand
      )
    )
- unit = MJ
